[package]
name = "osovm-witness-bridge"
version = "0.1.0"
edition = "2021"
description = "Off-chain submitter bridging Scarabswarm (PoSim) + Witness-firmware (LoRa DePIN) to OSOVM's techgnosis::proof_of_witness on Sui."
license = "BSL-1.1"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "fast"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "witness-bridge"
path = "src/main.rs"
